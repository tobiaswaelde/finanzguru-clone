name: finanzguru

services:
  finance-api:
    image: ${FINANCE_IMAGE_PREFIX:-ghcr.io/tobiaswaelde/finanzguru-clone}-api:${FINANCE_TAG:?Set FINANCE_TAG to a published tag}
    environment:
      API_SESSION_SECRET: ${API_SESSION_SECRET:?Set API_SESSION_SECRET}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?Set API_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - ./data/api:/data
    networks: [finance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 12
  finance-web:
    image: ${FINANCE_IMAGE_PREFIX:-ghcr.io/tobiaswaelde/finanzguru-clone}-web:${FINANCE_TAG:?Set FINANCE_TAG to a published tag}
    environment:
      NUXT_API_BASE_URL: http://finance-api:3001
    ports:
      - '127.0.0.1:${FINANCE_WEB_PORT:-3000}:3000'
    networks: [finance]
    depends_on:
      finance-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  finance:
    driver: bridge
